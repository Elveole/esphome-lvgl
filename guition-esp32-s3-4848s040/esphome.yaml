esphome:
  name: esp32
  friendly_name: ESP32

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y  

logger:

api:
  encryption:
    key: "r+IkMRUHXHOrvJ6Tn74HrFUESP9Woh6Zx4vEfluQnLA="

ota:
  - platform: esphome
    encryption:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32 Fallback Hotspot
    password: "G0MvVY5CQcR9"


# Packages
packages:
  setup:
    url: https://github.com/Elveole/esphome-lvgl/
    file: guition-esp32-s3-4848s040/package.yaml
    refresh: 1sec
